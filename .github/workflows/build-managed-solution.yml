
name: Build Managed Solution

on:
  workflow_dispatch:
    inputs:
      solution_name:
        description: "Solution unique name"
        required: true
        default: "EmployeeALMDemo"
        type: string

permissions:
  contents: read

jobs:
  build-managed-solution:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Verify Dev connection
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ secrets.DEV_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}

      - name: Create output folder
        run: mkdir -p out

      - name: Export managed solution from Dev
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ secrets.DEV_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: ${{ inputs.solution_name }}
          solution-output-file: out/${{ inputs.solution_name }}_managed.zip
          managed: true

      - name: Verify managed solution artifact
        shell: bash
        env:
          SOLUTION_NAME: ${{ inputs.solution_name }}
        run: |
          FILE="out/${SOLUTION_NAME}_managed.zip"

          if [ ! -s "$FILE" ]; then
            echo "::error::Managed solution ZIP was not created or is empty."
            exit 1
          fi

          echo "Managed solution artifact created:"
          ls -lh "$FILE"

      - name: Upload managed solution artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmployeeALMDemo-managed
          path: out/${{ inputs.solution_name }}_managed.zip
          if-no-files-found: error
          retention-days: 30

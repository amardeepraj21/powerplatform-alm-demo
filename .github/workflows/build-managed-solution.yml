
name: Build Managed Solution

on:
  push:
    branches:
      - main
    paths:
      - "solutions/**"
      - ".github/workflows/build-managed-solution.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  SOLUTION_NAME: ${{ vars.PP_SOLUTION_NAME }}

jobs:
  build-managed-solution:
    name: Build Managed Solution
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout the reviewed source merged into main
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Validate configuration and solution source
      - name: Validate solution source
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$SOLUTION_NAME" ]; then
            echo "::error::Repository variable PP_SOLUTION_NAME is not configured."
            exit 1
          fi

          SOLUTION_FOLDER="solutions/$SOLUTION_NAME"

          if [ ! -d "$SOLUTION_FOLDER" ]; then
            echo "::error::Solution folder not found: $SOLUTION_FOLDER"
            exit 1
          fi

          if [ ! -f "$SOLUTION_FOLDER/Other/Solution.xml" ]; then
            echo "::error::Solution.xml not found in $SOLUTION_FOLDER/Other/"
            echo "Make sure the unmanaged solution has been unpacked into source control."
            exit 1
          fi

          echo "Validated solution source: $SOLUTION_FOLDER"

      # 3. Install Microsoft Power Platform tools
      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      # 4. Pack the committed source as a managed solution
      - name: Pack managed solution
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: solutions/${{ env.SOLUTION_NAME }}
          solution-file: artifacts/${{ env.SOLUTION_NAME }}_managed.zip
          solution-type: Managed
          overwrite-files: true

      # 5. Verify the generated managed package
      - name: Verify managed solution package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="artifacts/${SOLUTION_NAME}_managed.zip"

          if [ ! -f "$PACKAGE" ] || [ ! -s "$PACKAGE" ]; then
            echo "::error::Managed solution ZIP was not created or is empty: $PACKAGE"
            exit 1
          fi

          echo "Managed package created successfully:"
          ls -lh "$PACKAGE"

      # 6. Upload the artifact for downstream deployment workflows
      - name: Upload managed solution artifact
        uses: actions/upload-artifact@v6
        with:
          name: managed-solution
          path: artifacts/${{ env.SOLUTION_NAME }}_managed.zip
          if-no-files-found: error
          retention-days: 30

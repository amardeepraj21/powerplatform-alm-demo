
name: Build Managed Solution

on:
  push:
    branches:
      - main
    paths:
      - "solutions/**"
      - ".github/workflows/build-managed-solution.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  SOLUTION_NAME: ${{ vars.PP_SOLUTION_NAME }}

jobs:
  build-managed-solution:
    name: Build Managed Solution
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout the merged solution source
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Validate the dual-format solution source
      - name: Validate solution source
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$SOLUTION_NAME" ]; then
            echo "::error::PP_SOLUTION_NAME is not configured."
            exit 1
          fi

          SOLUTION_FOLDER="solutions/$SOLUTION_NAME"

          if [ ! -f "$SOLUTION_FOLDER/Other/Solution.xml" ]; then
            echo "::error::Solution.xml not found in $SOLUTION_FOLDER/Other/"
            exit 1
          fi

          if ! grep -q '<Managed>0</Managed>' \
            "$SOLUTION_FOLDER/Other/Solution.xml"; then
            echo "::error::Expected unmanaged solution metadata was not found."
            echo "Check that the source was unpacked correctly."
            exit 1
          fi

          echo "Solution source validation passed."

      # 3. Install Power Platform tools
      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      # 4. Create the artifact directory
      - name: Create artifact directory
        shell: bash
        run: mkdir -p artifacts

      # 5. Pack the dual-format source as Managed
      - name: Pack managed solution
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: solutions/${{ env.SOLUTION_NAME }}
          solution-file: artifacts/${{ env.SOLUTION_NAME }}_managed.zip
          solution-type: Managed

      # 6. Verify the managed package
      - name: Verify managed solution package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="artifacts/${SOLUTION_NAME}_managed.zip"

          if [ ! -s "$PACKAGE" ]; then
            echo "::error::Managed package was not created or is empty."
            exit 1
          fi

          unzip -t "$PACKAGE"

          echo "Managed package created successfully."
          ls -lh "$PACKAGE"

      # 7. Upload the artifact for QA and Production
      - name: Upload managed solution artifact
        uses: actions/upload-artifact@v6
        with:
          name: managed-solution
          path: artifacts/${{ env.SOLUTION_NAME }}_managed.zip
          if-no-files-found: error
          retention-days: 30


name: Build Managed Solution

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'solutions/**'
      - '.github/workflows/build-managed-solution.yml'

permissions:
  contents: read
  actions: read

env:
  SOLUTION_NAME: ${{ vars.PP_SOLUTION_NAME }}
  SOLUTION_ZIP: out/${{ vars.PP_SOLUTION_NAME }}_managed.zip

jobs:
  build-managed:
    name: Export Managed Solution
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate configuration
        shell: bash
        env:
          DEV_URL: ${{ secrets.DEV_ENVIRONMENT_URL }}
          APP_ID: ${{ secrets.PP_APP_ID }}
          TENANT_ID: ${{ secrets.PP_TENANT_ID }}
          CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$SOLUTION_NAME" ]; then
            echo "::error::Repository variable PP_SOLUTION_NAME is not configured."
            exit 1
          fi

          if [ -z "$DEV_URL" ] || [ -z "$APP_ID" ] || \
             [ -z "$TENANT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::One or more required GitHub secrets are missing."
            exit 1
          fi

          echo "Solution: $SOLUTION_NAME"
          echo "Source environment: Dev"

      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Create output directory
        shell: bash
        run: mkdir -p out

      - name: Export managed solution from Dev
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ secrets.DEV_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: ${{ env.SOLUTION_NAME }}
          solution-output-file: ${{ env.SOLUTION_ZIP }}
          managed: true
          overwrite: true

      - name: Verify managed solution ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s "$SOLUTION_ZIP" ]; then
            echo "::error::Managed solution ZIP was not created."
            exit 1
          fi

          unzip -t "$SOLUTION_ZIP"
          echo "Managed solution ZIP verified successfully."

      - name: Upload managed solution artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.SOLUTION_NAME }}-managed
          path: ${{ env.SOLUTION_ZIP }}
          if-no-files-found: error
          retention-days: 30

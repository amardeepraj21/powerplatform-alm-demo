
name: Export Dev Solution

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Choose how to update the solution version"
        required: true
        type: choice
        default: revision
        options:
          - revision
          - build
          - minor
          - major
          - custom

      custom_version:
        description: "Custom version (example: 2.3.0.0)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

env:
  SOLUTION_NAME: ${{ vars.PP_SOLUTION_NAME }}

jobs:
  export-dev-solution:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install PAC CLI
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool update --global Microsoft.PowerApps.CLI.Tool \
            || dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Verify Dev connection
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ secrets.DEV_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}

      - name: Authenticate PAC CLI to Dev
        shell: bash
        env:
          DEV_URL: ${{ secrets.DEV_ENVIRONMENT_URL }}
          APP_ID: ${{ secrets.PP_APP_ID }}
          CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.PP_TENANT_ID }}
        run: |
          set -euo pipefail
          pac auth create \
            --name "Dev-SP" \
            --url "$DEV_URL" \
            --applicationId "$APP_ID" \
            --clientSecret "$CLIENT_SECRET" \
            --tenant "$TENANT_ID"
          pac auth select --name "Dev-SP"

      - name: Calculate solution version
        id: version
        shell: bash
        env:
          DEV_URL: ${{ secrets.DEV_ENVIRONMENT_URL }}
          SOLUTION_NAME: ${{ env.SOLUTION_NAME }}
          VERSION_TYPE: ${{ inputs.version_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          set -euo pipefail

          if [ -z "$SOLUTION_NAME" ]; then
            echo "::error::PP_SOLUTION_NAME is not configured."
            exit 1
          fi

          OUTPUT=$(pac solution online-version \
            --solution-name "$SOLUTION_NAME" \
            --environment "$DEV_URL")

          echo "$OUTPUT"

          CURRENT_VERSION=$(printf '%s\n' "$OUTPUT" |
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' |
            head -n 1 || true)

          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not determine the current solution version."
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR BUILD REVISION <<< "$CURRENT_VERSION"

          case "$VERSION_TYPE" in
            revision)
              REVISION=$((REVISION + 1))
              NEW_VERSION="$MAJOR.$MINOR.$BUILD.$REVISION"
              ;;
            build)
              BUILD=$((BUILD + 1))
              NEW_VERSION="$MAJOR.$MINOR.$BUILD.0"
              ;;
            minor)
              MINOR=$((MINOR + 1))
              NEW_VERSION="$MAJOR.$MINOR.0.0"
              ;;
            major)
              MAJOR=$((MAJOR + 1))
              NEW_VERSION="$MAJOR.0.0.0"
              ;;
            custom)
              if [[ ! "$CUSTOM_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                echo "::error::Enter a valid four-part version."
                exit 1
              fi
              NEW_VERSION="$CUSTOM_VERSION"
              ;;
            *)
              echo "::error::Unsupported version type: $VERSION_TYPE"
              exit 1
              ;;
          esac

          IFS='.' read -r V1 V2 V3 V4 <<< "$NEW_VERSION"
          for PART in "$V1" "$V2" "$V3" "$V4"; do
            if (( PART > 65535 )); then
              echo "::error::Version components must not exceed 65535."
              exit 1
            fi
          done

          if [[ "$NEW_VERSION" == "$CURRENT_VERSION" ]]; then
            echo "::error::New version must differ from the current version."
            exit 1
          fi

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update solution version in Dev
        shell: bash
        env:
          DEV_URL: ${{ secrets.DEV_ENVIRONMENT_URL }}
          SOLUTION_NAME: ${{ env.SOLUTION_NAME }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail
          pac solution online-version \
            --solution-name "$SOLUTION_NAME" \
            --solution-version "$NEW_VERSION" \
            --environment "$DEV_URL"

      - name: Create export directories
        shell: bash
        run: mkdir -p out

      - name: Export unmanaged solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ secrets.DEV_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: ${{ env.SOLUTION_NAME }}
          solution-output-file: out/${{ env.SOLUTION_NAME }}_unmanaged.zip
          managed: false
          overwrite: true
          run-asynchronously: true
          max-async-wait-time: 60

      - name: Export managed solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ secrets.DEV_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: ${{ env.SOLUTION_NAME }}
          solution-output-file: out/${{ env.SOLUTION_NAME }}_managed.zip
          managed: true
          overwrite: true
          run-asynchronously: true
          max-async-wait-time: 60

      - name: Unpack solution source for managed and unmanaged builds
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: out/${{ env.SOLUTION_NAME }}_unmanaged.zip
          solution-folder: solutions/${{ env.SOLUTION_NAME }}
          solution-type: Both
          overwrite-files: true

      - name: Verify exported packages
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "out/${SOLUTION_NAME}_unmanaged.zip"
          unzip -t "out/${SOLUTION_NAME}_managed.zip"
          test -f "solutions/${SOLUTION_NAME}/Other/Solution.xml"
          echo "Both packages verified; source unpacked."

      - name: Push export branch and create pull request
        shell: bash
        env:
          ALM_GITHUB_TOKEN: ${{ secrets.ALM_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.ALM_GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          CURRENT_VERSION: ${{ steps.version.outputs.current_version }}
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          set -euo pipefail

          if [ -z "$ALM_GITHUB_TOKEN" ]; then
            echo "::error::ALM_GITHUB_TOKEN is not configured."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "solutions/$SOLUTION_NAME"

          if git diff --cached --quiet; then
            echo "No solution source changes detected."
            echo "The Dev version may already have been updated to $NEW_VERSION."
            exit 0
          fi

          BRANCH_NAME="automation/export-dev-${GITHUB_RUN_ID}"

          git checkout -b "$BRANCH_NAME"
          git commit -m "Export $SOLUTION_NAME from Dev ($NEW_VERSION)"

          git remote set-url origin \
            "https://x-access-token:${ALM_GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push --set-upstream origin "$BRANCH_NAME"

          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Export $SOLUTION_NAME from Dev - v$NEW_VERSION" \
            --body "## Summary
          - Solution: $SOLUTION_NAME
          - Previous version: $CURRENT_VERSION
          - New version: $NEW_VERSION
          - Version update type: $VERSION_TYPE
          - Exported managed and unmanaged packages from Dev.
          - Updated the repository's unpacked solution source.

          ## Validation
          Review the changes and ensure required validation checks pass before merging.")

          echo "Pull request created: $PR_URL"

      - name: Upload exported packages for troubleshooting
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.SOLUTION_NAME }}-dev-exports-${{ github.run_id }}
          path: out/*.zip
          if-no-files-found: ignore
          retention-days: 7


name: Export Dev Solution

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Choose how to update the solution version"
        required: true
        type: choice
        default: revision
        options:
          - revision
          - build
          - minor
          - major
          - custom

      custom_version:
        description: "Custom version (example: 2.3.0.0). Used only for custom."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

env:
  SOLUTION_NAME: ${{ vars.PP_SOLUTION_NAME }}

jobs:
  export-dev-solution:
    name: Export Unmanaged Solution from Dev
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 2. Install Power Platform tools
      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      # 3. Set up .NET
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # 4. Install PAC CLI
      - name: Install PAC CLI
        shell: bash
        run: |
          set -euo pipefail

          dotnet tool update --global Microsoft.PowerApps.CLI.Tool \
            || dotnet tool install --global Microsoft.PowerApps.CLI.Tool

          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

          "$HOME/.dotnet/tools/pac" help

      # 5. Verify service principal access to Dev
      - name: Verify Dev connection
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ secrets.DEV_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}

      # 6. Authenticate PAC CLI to Dev
      - name: Authenticate PAC CLI to Dev
        shell: bash
        env:
          DEV_URL: ${{ secrets.DEV_ENVIRONMENT_URL }}
          APP_ID: ${{ secrets.PP_APP_ID }}
          CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.PP_TENANT_ID }}
        run: |
          set -euo pipefail

          pac auth create \
            --name "Dev-SP" \
            --url "$DEV_URL" \
            --applicationId "$APP_ID" \
            --clientSecret "$CLIENT_SECRET" \
            --tenant "$TENANT_ID"

          pac auth select --name "Dev-SP"

      # 7. Calculate the next solution version
      - name: Calculate solution version
        id: version
        shell: bash
        env:
          DEV_URL: ${{ secrets.DEV_ENVIRONMENT_URL }}
          SOLUTION_NAME: ${{ env.SOLUTION_NAME }}
          VERSION_TYPE: ${{ inputs.version_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          set -euo pipefail

          if [ -z "$SOLUTION_NAME" ]; then
            echo "::error::Repository variable PP_SOLUTION_NAME is not configured."
            exit 1
          fi

          OUTPUT=$(pac solution online-version \
            --solution-name "$SOLUTION_NAME" \
            --environment "$DEV_URL")

          echo "$OUTPUT"

          CURRENT_VERSION=$(printf '%s\n' "$OUTPUT" |
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' |
            head -n 1 || true)

          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not determine the current solution version."
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR BUILD REVISION <<< "$CURRENT_VERSION"

          case "$VERSION_TYPE" in
            revision)
              REVISION=$((REVISION + 1))
              NEW_VERSION="$MAJOR.$MINOR.$BUILD.$REVISION"
              ;;
            build)
              BUILD=$((BUILD + 1))
              NEW_VERSION="$MAJOR.$MINOR.$BUILD.0"
              ;;
            minor)
              MINOR=$((MINOR + 1))
              NEW_VERSION="$MAJOR.$MINOR.0.0"
              ;;
            major)
              MAJOR=$((MAJOR + 1))
              NEW_VERSION="$MAJOR.0.0.0"
              ;;
            custom)
              if [[ ! "$CUSTOM_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                echo "::error::Enter a valid four-part version, e.g. 2.3.0.0."
                exit 1
              fi

              NEW_VERSION="$CUSTOM_VERSION"
              ;;
            *)
              echo "::error::Unsupported version type: $VERSION_TYPE"
              exit 1
              ;;
          esac

          IFS='.' read -r V1 V2 V3 V4 <<< "$NEW_VERSION"

          for PART in "$V1" "$V2" "$V3" "$V4"; do
            if (( PART > 65535 )); then
              echo "::error::Version components must not exceed 65535."
              exit 1
            fi
          done

          if [[ "$NEW_VERSION" == "$CURRENT_VERSION" ]]; then
            echo "::error::New version must differ from the current version."
            exit 1
          fi

          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"
          echo "Version selection: $VERSION_TYPE"

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # 8. Update the solution version in Dev
      - name: Update solution version in Dev
        shell: bash
        env:
          DEV_URL: ${{ secrets.DEV_ENVIRONMENT_URL }}
          SOLUTION_NAME: ${{ env.SOLUTION_NAME }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail

          pac solution online-version \
            --solution-name "$SOLUTION_NAME" \
            --solution-version "$NEW_VERSION" \
            --environment "$DEV_URL"

          echo "Updated $SOLUTION_NAME to version $NEW_VERSION."

      # 9. Create the export directory
      - name: Create export directory
        shell: bash
        run: mkdir -p out

      # 10. Export only the unmanaged solution from Dev
      - name: Export unmanaged solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ secrets.DEV_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: ${{ env.SOLUTION_NAME }}
          solution-output-file: out/${{ env.SOLUTION_NAME }}_unmanaged.zip
          managed: false
          overwrite: true
          run-asynchronously: true
          max-async-wait-time: 60

      # 11. Unpack the unmanaged export into the single source folder
      - name: Unpack unmanaged solution source
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: out/${{ env.SOLUTION_NAME }}_unmanaged.zip
          solution-folder: solutions/${{ env.SOLUTION_NAME }}
          solution-type: Unmanaged
          overwrite-files: true

      # 12. Verify the export and unpacked source
      - name: Verify exported solution
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="out/${SOLUTION_NAME}_unmanaged.zip"
          SOURCE_FOLDER="solutions/${SOLUTION_NAME}"

          if [ ! -s "$ZIP_FILE" ]; then
            echo "::error::Unmanaged solution ZIP is missing or empty."
            exit 1
          fi

          unzip -t "$ZIP_FILE"

          if [ ! -f "$SOURCE_FOLDER/Other/Solution.xml" ]; then
            echo "::error::Unpacked Solution.xml was not found."
            exit 1
          fi

          echo "Unmanaged export and source validation completed."
          ls -lh "$ZIP_FILE"

      # 13. Create a branch and open a pull request
      - name: Push export branch and create pull request
        shell: bash
        env:
          ALM_GITHUB_TOKEN: ${{ secrets.ALM_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.ALM_GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          CURRENT_VERSION: ${{ steps.version.outputs.current_version }}
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          set -euo pipefail

          if [ -z "$ALM_GITHUB_TOKEN" ]; then
            echo "::error::Repository secret ALM_GITHUB_TOKEN is not configured."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "solutions/$SOLUTION_NAME"

          if git diff --cached --quiet; then
            echo "No solution source changes detected."
            echo "Dev version may already have been updated to $NEW_VERSION."
            exit 0
          fi

          BRANCH_NAME="automation/export-dev-${GITHUB_RUN_ID}"

          git checkout -b "$BRANCH_NAME"

          git commit \
            -m "Export $SOLUTION_NAME from Dev ($NEW_VERSION)"

          git remote set-url origin \
            "https://x-access-token:${ALM_GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push --set-upstream origin "$BRANCH_NAME"

          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Export $SOLUTION_NAME from Dev - v$NEW_VERSION" \
            --body "## Summary
          - Solution: $SOLUTION_NAME
          - Previous version: $CURRENT_VERSION
          - New version: $NEW_VERSION
          - Version update type: $VERSION_TYPE
          - Exported the unmanaged solution from Dev.
          - Updated the single unpacked solution source folder.

          ## Validation
          Review the exported source changes and ensure required validation checks pass before merging.

          After merging, the Build Managed Solution workflow will generate the managed deployment artifact.")

          echo "Pull request created: $PR_URL"

      # 14. Upload the unmanaged export for troubleshooting
      - name: Upload unmanaged export artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.SOLUTION_NAME }}-dev-unmanaged-export-${{ github.run_id }}
          path: out/${{ env.SOLUTION_NAME }}_unmanaged.zip
          if-no-files-found: ignore
          retention-days: 7

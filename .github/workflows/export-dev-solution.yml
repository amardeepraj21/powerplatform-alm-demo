
name: Export Dev Solution

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Choose how to update the solution version"
        required: true
        type: choice
        default: revision
        options:
          - revision
          - build
          - minor
          - major
          - custom

      custom_version:
        description: "Custom version (example: 2.3.0.0). Used only when version_type is custom."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

env:
  SOLUTION_NAME: ${{ vars.PP_SOLUTION_NAME }}

jobs:
  export-dev-solution:
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 2. Install Power Platform tools
      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      # 3. Install .NET SDK
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # 4. Install PAC CLI
      - name: Install PAC CLI
        shell: bash
        run: |
          set -euo pipefail

          dotnet tool update --global Microsoft.PowerApps.CLI.Tool \
            || dotnet tool install --global Microsoft.PowerApps.CLI.Tool

          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

          "$HOME/.dotnet/tools/pac" help

      # 5. Verify Dev connection
      - name: Verify Dev connection
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ secrets.DEV_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}

      # 6. Authenticate PAC CLI to Dev
      - name: Authenticate PAC CLI to Dev
        shell: bash
        env:
          DEV_URL: ${{ secrets.DEV_ENVIRONMENT_URL }}
          APP_ID: ${{ secrets.PP_APP_ID }}
          CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.PP_TENANT_ID }}
        run: |
          set -euo pipefail

          pac auth create \
            --name "Dev-SP" \
            --url "$DEV_URL" \
            --applicationId "$APP_ID" \
            --clientSecret "$CLIENT_SECRET" \
            --tenant "$TENANT_ID"

          pac auth select --name "Dev-SP"

      # 7. Read the current version and calculate the requested version.
      # This step does not change the version in Dev.
      - name: Calculate solution version
        id: version
        shell: bash
        env:
          DEV_URL: ${{ secrets.DEV_ENVIRONMENT_URL }}
          SOLUTION_NAME: ${{ env.SOLUTION_NAME }}
          VERSION_TYPE: ${{ inputs.version_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          set -euo pipefail

          if [ -z "$SOLUTION_NAME" ]; then
            echo "::error::Repository variable PP_SOLUTION_NAME is not configured."
            exit 1
          fi

          OUTPUT=$(pac solution online-version \
            --solution-name "$SOLUTION_NAME" \
            --environment "$DEV_URL")

          echo "$OUTPUT"

          CURRENT_VERSION=$(printf '%s\n' "$OUTPUT" |
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' |
            head -n 1 || true)

          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not determine a valid current solution version."
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR BUILD REVISION <<< "$CURRENT_VERSION"

          case "$VERSION_TYPE" in
            revision)
              REVISION=$((REVISION + 1))
              NEW_VERSION="$MAJOR.$MINOR.$BUILD.$REVISION"
              ;;

            build)
              BUILD=$((BUILD + 1))
              NEW_VERSION="$MAJOR.$MINOR.$BUILD.0"
              ;;

            minor)
              MINOR=$((MINOR + 1))
              NEW_VERSION="$MAJOR.$MINOR.0.0"
              ;;

            major)
              MAJOR=$((MAJOR + 1))
              NEW_VERSION="$MAJOR.0.0.0"
              ;;

            custom)
              if [[ ! "$CUSTOM_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                echo "::error::Enter a valid four-part version, such as 2.3.0.0."
                exit 1
              fi

              NEW_VERSION="$CUSTOM_VERSION"
              ;;

            *)
              echo "::error::Unsupported version type: $VERSION_TYPE"
              exit 1
              ;;
          esac

          IFS='.' read -r V1 V2 V3 V4 <<< "$NEW_VERSION"

          for PART in "$V1" "$V2" "$V3" "$V4"; do
            if (( PART > 65535 )); then
              echo "::error::Version components must not exceed 65535."
              exit 1
            fi
          done

          if [[ "$NEW_VERSION" == "$CURRENT_VERSION" ]]; then
            echo "::error::New version must differ from the current version."
            exit 1
          fi

          echo "Current version: $CURRENT_VERSION"
          echo "Selected version type: $VERSION_TYPE"
          echo "Requested new version: $NEW_VERSION"

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # 8. Export the current Dev solution for comparison.
      # The online version has not been changed at this point.
      - name: Export current solution for comparison
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ secrets.DEV_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: ${{ env.SOLUTION_NAME }}
          solution-output-file: out/preflight-solution.zip
          managed: false
          overwrite: true
          run-asynchronously: true
          max-async-wait-time: 60

      # 9. Unpack the comparison export into a temporary folder.
      - name: Unpack comparison solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: out/preflight-solution.zip
          solution-folder: out/preflight/${{ env.SOLUTION_NAME }}
          solution-type: Unmanaged
          overwrite-files: true

      # 10. Compare solution files against main.
      # Only solution source differences should trigger the version update and PR.
      - name: Detect solution changes
        id: changes
        shell: bash
        env:
          SOLUTION_NAME: ${{ env.SOLUTION_NAME }}
        run: |
          set -euo pipefail

          REPO_FOLDER="solutions/$SOLUTION_NAME"
          EXPORTED_FOLDER="out/preflight/$SOLUTION_NAME"

          if [ ! -d "$REPO_FOLDER" ]; then
            echo "::error::Repository solution folder not found: $REPO_FOLDER"
            exit 1
          fi

          if [ ! -d "$EXPORTED_FOLDER" ]; then
            echo "::error::Exported solution folder not found: $EXPORTED_FOLDER"
            exit 1
          fi

          if diff -qr "$REPO_FOLDER" "$EXPORTED_FOLDER" \
              --exclude='*.log'; then
            echo "No solution source changes detected."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Solution source changes detected."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # 11. Update Dev version only when solution source has changed.
      - name: Update solution version in Dev
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        env:
          DEV_URL: ${{ secrets.DEV_ENVIRONMENT_URL }}
          SOLUTION_NAME: ${{ env.SOLUTION_NAME }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail

          pac solution online-version \
            --solution-name "$SOLUTION_NAME" \
            --solution-version "$NEW_VERSION" \
            --environment "$DEV_URL"

          echo "Updated $SOLUTION_NAME to version $NEW_VERSION"

      # 12. Export the final solution with the selected version.
      - name: Export final unmanaged solution
        if: steps.changes.outputs.has_changes == 'true'
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ secrets.DEV_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: ${{ env.SOLUTION_NAME }}
          solution-output-file: out/${{ env.SOLUTION_NAME }}.zip
          managed: false
          overwrite: true
          run-asynchronously: true
          max-async-wait-time: 60

      # 13. Unpack the final export into the repository solution folder.
      - name: Unpack final solution
        if: steps.changes.outputs.has_changes == 'true'
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: out/${{ env.SOLUTION_NAME }}.zip
          solution-folder: solutions/${{ env.SOLUTION_NAME }}
          solution-type: Unmanaged
          overwrite-files: true

      # 14. Create or update the export PR.
      # A stable branch name allows subsequent exports to update the
      # existing PR instead of creating a new PR for every run.
      - name: Push export branch and create or update pull request
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        env:
          SOLUTION_NAME: ${{ env.SOLUTION_NAME }}
          ALM_GITHUB_TOKEN: ${{ secrets.ALM_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.ALM_GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          CURRENT_VERSION: ${{ steps.version.outputs.current_version }}
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          set -euo pipefail

          if [ -z "$ALM_GITHUB_TOKEN" ]; then
            echo "::error::Repository secret ALM_GITHUB_TOKEN is not configured."
            exit 1
          fi

          REPO_FOLDER="solutions/$SOLUTION_NAME"
          BRANCH_NAME="automation/export-dev-$SOLUTION_NAME"

          # Preserve the exported snapshot before switching branches.
          EXPORT_SNAPSHOT="$RUNNER_TEMP/exported-solution"
          mkdir -p "$EXPORT_SNAPSHOT"
          rsync -a --delete "$REPO_FOLDER/" "$EXPORT_SNAPSHOT/"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Fetch the latest main branch and reset the automation branch
          # to main so the PR contains only the current exported solution.
          git fetch origin main

          git checkout -B "$BRANCH_NAME" origin/main

          # Apply the exported snapshot, including deletions.
          mkdir -p "$REPO_FOLDER"
          rsync -a --delete "$EXPORT_SNAPSHOT/" "$REPO_FOLDER/"

          git add "$REPO_FOLDER"

          if git diff --cached --quiet; then
            echo "The export matches main. No PR update is needed."
            exit 0
          fi

          git commit -m "Export $SOLUTION_NAME from Dev ($NEW_VERSION)"

          # Use the fine-grained PAT for the branch push.
          git remote set-url origin \
            "https://x-access-token:${ALM_GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # This branch is automation-managed. It is intentionally
          # refreshed from main on each export.
          git push --force origin "$BRANCH_NAME"

          # Reuse an existing open PR when one already targets main.
          EXISTING_PR=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH_NAME" \
            --base main \
            --state open \
            --json url \
            --jq '.[0].url // empty')

          if [ -n "$EXISTING_PR" ]; then
            echo "Updated existing export PR: $EXISTING_PR"
          else
            PR_URL=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH_NAME" \
              --title "Export $SOLUTION_NAME from Dev - v$NEW_VERSION" \
              --body "## Summary
          - Solution: $SOLUTION_NAME
          - Previous version: $CURRENT_VERSION
          - New version: $NEW_VERSION
          - Version update type: $VERSION_TYPE
          - Exported and unpacked the unmanaged solution from Dev.

          ## Validation
          The required Validate Power Platform Solution check must pass before merging.

          Please review the exported changes before merging.")

            echo "Created export PR: $PR_URL"
          fi

      # 15. Clear status when no solution source changes were found.
      - name: Report no solution changes
        if: steps.changes.outputs.has_changes == 'false'
        shell: bash
        run: |
          echo "No solution source changes were detected."
          echo "Dev solution version was not incremented."
          echo "No export branch or pull request was created."

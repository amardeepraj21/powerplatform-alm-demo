
name: Export Dev Solution

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/export-dev-solution.yml"

permissions:
  contents: write

jobs:
  export-dev-solution:
    runs-on: ubuntu-24.04

    steps:
      # 1. Get repository files
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Required before using any Power Platform Action
      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      # 3. Verify the Dev environment connection
      - name: Verify Dev connection
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ secrets.DEV_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}

      # 4. Create a PAC CLI authentication profile for Dev
      - name: Authenticate PAC CLI to Dev
        shell: bash
        env:
          DEV_URL: ${{ secrets.DEV_ENVIRONMENT_URL }}
          APP_ID: ${{ secrets.PP_APP_ID }}
          CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.PP_TENANT_ID }}
        run: |
          set -euo pipefail

          pac auth create \
            --name "Dev-SP" \
            --environment "$DEV_URL" \
            --applicationId "$APP_ID" \
            --clientSecret "$CLIENT_SECRET" \
            --tenant "$TENANT_ID"

          pac auth select --name "Dev-SP"

      # 5. Read the current online solution version
      - name: Get current solution version
        id: version
        shell: bash
        env:
          DEV_URL: ${{ secrets.DEV_ENVIRONMENT_URL }}
        run: |
          set -euo pipefail

          OUTPUT=$(pac solution online-version \
            --solution-name "EmployeeALMDemo" \
            --environment "$DEV_URL")

          echo "$OUTPUT"

          CURRENT_VERSION=$(printf '%s\n' "$OUTPUT" |
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' |
            head -n 1 || true)

          if [ -z "$CURRENT_VERSION" ]; then
            echo "::error::Could not determine the current solution version."
            exit 1
          fi

          echo "Current version: $CURRENT_VERSION"

          IFS='.' read -r MAJOR MINOR BUILD REVISION <<< "$CURRENT_VERSION"

          NEW_REVISION=$((REVISION + 1))
          NEW_VERSION="$MAJOR.$MINOR.$BUILD.$NEW_REVISION"

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          echo "New version: $NEW_VERSION"

      # 6. Update the solution version in Dataverse
      - name: Increment online solution version
        shell: bash
        env:
          DEV_URL: ${{ secrets.DEV_ENVIRONMENT_URL }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail

          pac solution online-version \
            --solution-name "EmployeeALMDemo" \
            --solution-version "$NEW_VERSION" \
            --environment "$DEV_URL"

          echo "Solution version updated to $NEW_VERSION"

      # 7. Export the unmanaged solution from Dev
      - name: Export unmanaged solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ secrets.DEV_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: EmployeeALMDemo
          solution-output-file: EmployeeALMDemo.zip
          managed: false
          overwrite: true
          run-asynchronously: true
          max-async-wait-time: 60

      # 8. Unpack the ZIP into source-control-friendly files
      - name: Unpack solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: EmployeeALMDemo.zip
          solution-folder: solutions/EmployeeALMDemo
          solution-type: Unmanaged
          overwrite-files: true

      # 9. Commit the unpacked solution back to GitHub
      - name: Commit solution changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add solutions/EmployeeALMDemo

          if git diff --cached --quiet; then
            echo "No unpacked solution changes to commit."
          else
            git commit -m "Export EmployeeALMDemo from Dev"
            git push
          fi

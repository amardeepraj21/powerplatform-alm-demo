
name: Export Dev Solution to GitHub

on:
  workflow_dispatch:
    inputs:
      solution_name:
        description: "Solution unique name"
        required: true
        default: "EmployeeALMDemo"
        type: string

permissions:
  contents: write

jobs:
  export-and-commit:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install PAC CLI
        shell: bash
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          "$HOME/.dotnet/tools/pac" --version

      - name: Verify Dev connection
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ secrets.DEV_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}

      - name: Authenticate PAC CLI to Dev
        shell: bash
        env:
          PP_APP_ID: ${{ secrets.PP_APP_ID }}
          PP_CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          PP_TENANT_ID: ${{ secrets.PP_TENANT_ID }}
          DEV_ENVIRONMENT_URL: ${{ secrets.DEV_ENVIRONMENT_URL }}
        run: |
          set -euo pipefail

          pac auth create \
            --name Dev \
            --applicationId "$PP_APP_ID" \
            --clientSecret "$PP_CLIENT_SECRET" \
            --tenant "$PP_TENANT_ID" \
            --environment "$DEV_ENVIRONMENT_URL"

          pac auth list

      - name: Read current solution version
        id: current_version
        shell: bash
        env:
          SOLUTION_NAME: ${{ inputs.solution_name }}
          DEV_ENVIRONMENT_URL: ${{ secrets.DEV_ENVIRONMENT_URL }}
        run: |
          set -euo pipefail

          OUTPUT=$(pac solution online-version \
            --solution-name "$SOLUTION_NAME" \
            --environment "$DEV_ENVIRONMENT_URL" 2>&1) || {
              echo "$OUTPUT"
              echo "::error::Unable to read the solution version."
              exit 1
            }

          echo "$OUTPUT"

          CURRENT_VERSION=$(printf '%s\n' "$OUTPUT" |
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' |
            tail -n 1 || true)

          if [ -z "$CURRENT_VERSION" ]; then
            echo "::error::Could not identify the current solution version from PAC CLI output."
            exit 1
          fi

          echo "Current version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Increment solution revision in Dev
        id: version
        shell: bash
        env:
          SOLUTION_NAME: ${{ inputs.solution_name }}
          DEV_ENVIRONMENT_URL: ${{ secrets.DEV_ENVIRONMENT_URL }}
          CURRENT_VERSION: ${{ steps.current_version.outputs.version }}
        run: |
          set -euo pipefail

          IFS='.' read -r MAJOR MINOR BUILD REVISION \
            <<< "$CURRENT_VERSION"

          NEW_REVISION=$((REVISION + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${BUILD}.${NEW_REVISION}"

          echo "Updating Dev from $CURRENT_VERSION to $NEW_VERSION"

          pac solution online-version \
            --solution-name "$SOLUTION_NAME" \
            --solution-version "$NEW_VERSION" \
            --environment "$DEV_ENVIRONMENT_URL"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify updated solution version
        shell: bash
        env:
          SOLUTION_NAME: ${{ inputs.solution_name }}
          DEV_ENVIRONMENT_URL: ${{ secrets.DEV_ENVIRONMENT_URL }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          OUTPUT=$(pac solution online-version \
            --solution-name "$SOLUTION_NAME" \
            --environment "$DEV_ENVIRONMENT_URL" 2>&1)

          echo "$OUTPUT"

          if ! printf '%s\n' "$OUTPUT" |
            grep -Fq "$EXPECTED_VERSION"; then
              echo "::error::Dev solution version does not match the expected version $EXPECTED_VERSION."
              exit 1
          fi

          echo "Verified Dev solution version: $EXPECTED_VERSION"

      - name: Create export folder
        run: mkdir -p out

      - name: Export unmanaged solution from Dev
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ secrets.DEV_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: ${{ inputs.solution_name }}
          solution-output-file: out/${{ inputs.solution_name }}.zip
          managed: false

      - name: Remove previous unpacked source
        shell: bash
        env:
          SOLUTION_NAME: ${{ inputs.solution_name }}
        run: |
          rm -rf "solutions/${SOLUTION_NAME}"

      - name: Unpack solution into source files
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: out/${{ inputs.solution_name }}.zip
          solution-folder: solutions/${{ inputs.solution_name }}
          solution-type: Unmanaged
          overwrite-files: true

      - name: Verify unpacked files
        shell: bash
        env:
          SOLUTION_NAME: ${{ inputs.solution_name }}
        run: |
          set -euo pipefail
          SOURCE_DIR="solutions/${SOLUTION_NAME}"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "::error::Solution source directory was not created."
            exit 1
          fi

          if [ -z "$(find "$SOURCE_DIR" -type f -print -quit)" ]; then
            echo "::error::No source files were generated."
            exit 1
          fi

          echo "Generated source files:"
          find "$SOURCE_DIR" -type f | head -100

      - name: Commit source files
        shell: bash
        env:
          SOLUTION_NAME: ${{ inputs.solution_name }}
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- "solutions/${SOLUTION_NAME}"

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            echo "Dev solution version is now ${NEW_VERSION}."
            exit 0
          fi

          git commit -m "Export ${SOLUTION_NAME} v${NEW_VERSION} from Dev"
          git push origin "HEAD:${GITHUB_REF_NAME}"

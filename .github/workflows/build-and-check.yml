name: Build and Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    name: Validate Power Platform Solution
    runs-on: ubuntu-latest

    env:
      SOLUTION_NAME: ${{ vars.PP_SOLUTION_NAME }}
      SOLUTION_FOLDER: solutions/EmployeeALMDemo
      SOLUTION_ZIP: out/EmployeeALMDemo.zip

    steps:
      # 1. Download repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install PAC CLI
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      # 3. Verify CLI installation
      - name: Verify PAC CLI
        shell: bash
        run: |
          set -euo pipefail
          pac help

      # 4. Validate solution source folder
      - name: Validate solution folder
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$SOLUTION_FOLDER" ]; then
            echo "::error::Solution folder not found: $SOLUTION_FOLDER"
            exit 1
          fi

          if [ ! -f "$SOLUTION_FOLDER/Other/Solution.xml" ]; then
            echo "::error::Other/Solution.xml not found."
            echo "Check that the solution is unpacked correctly."
            exit 1
          fi

          echo "Solution source folder exists."

      # 5. Validate deployment settings JSON
      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("deployment-settings/qa.json"),
              Path("deployment-settings/prod.json"),
          ]

          for file in files:
              if not file.is_file():
                  raise SystemExit(f"Missing file: {file}")

              with file.open(encoding="utf-8") as f:
                  json.load(f)

              print(f"Valid JSON: {file}")
          PY

      # 6. Package solution
      - name: Pack Power Platform solution
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out

          pac solution pack \
            --folder "$SOLUTION_FOLDER" \
            --zipfile "$SOLUTION_ZIP" \
            --packagetype Unmanaged

          if [ ! -s "$SOLUTION_ZIP" ]; then
            echo "::error::Solution ZIP was not created."
            exit 1
          fi

          echo "Solution packaged successfully."

      # 7. Authenticate PAC CLI using the Dev environment
      - name: Authenticate PAC CLI
        shell: bash
        env:
          PP_APP_ID: ${{ secrets.PP_APP_ID }}
          PP_TENANT_ID: ${{ secrets.PP_TENANT_ID }}
          PP_CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          DEV_ENVIRONMENT_URL: ${{ secrets.DEV_ENVIRONMENT_URL }}
        run: |
          set -euo pipefail

          : "${PP_APP_ID:?Missing PP_APP_ID secret}"
          : "${PP_TENANT_ID:?Missing PP_TENANT_ID secret}"
          : "${PP_CLIENT_SECRET:?Missing PP_CLIENT_SECRET secret}"
          : "${DEV_ENVIRONMENT_URL:?Missing DEV_ENVIRONMENT_URL secret}"

          pac auth create \
            --environment "$DEV_ENVIRONMENT_URL" \
            --applicationId "$PP_APP_ID" \
            --clientSecret "$PP_CLIENT_SECRET" \
            --tenant "$PP_TENANT_ID"

          pac org who

      # 8. Run Power Apps Solution Checker
      - name: Run Power Platform Solution Checker
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out/checker-results

          pac solution check \
            --path "$SOLUTION_ZIP" \
            --outputDirectory out/checker-results \
            --geo India

      # 9. Save checker results for inspection
      - name: Upload Solution Checker results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: power-platform-solution-checker-results
          path: out/checker-results/
          if-no-files-found: warn
```

name: Build and Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    name: Validate Power Platform Solution
    runs-on: ubuntu-latest

    env:
      SOLUTION_FOLDER: solutions/EmployeeALMDemo
      SOLUTION_ZIP: out/EmployeeALMDemo.zip

    steps:
      # 1. Install Power Platform CLI FIRST
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      # 2. Diagnose PAC CLI installation
      - name: Verify PAC CLI
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner PATH:"
          echo "$PATH"

          if ! command -v pac >/dev/null 2>&1; then
            echo "PAC CLI was not found on PATH."
            echo "Searching common installation locations..."

            find "$HOME" /usr/local/bin \
              -type f -name pac -print 2>/dev/null || true

            echo "::error::PAC CLI is not available after installation."
            exit 1
          fi

          pac help

      # 3. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 4. Validate solution folder
      - name: Validate solution folder
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$SOLUTION_FOLDER" ]; then
            echo "::error::Solution folder not found: $SOLUTION_FOLDER"
            exit 1
          fi

          if [ ! -f "$SOLUTION_FOLDER/Other/Solution.xml" ]; then
            echo "::error::Solution.xml not found in Other/Solution.xml."
            echo "Check the actual unpacked solution structure."
            exit 1
          fi

          echo "Solution folder validated."

      # 5. Validate deployment settings
      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          for path in (
              Path("deployment-settings/qa.json"),
              Path("deployment-settings/prod.json"),
          ):
              if not path.is_file():
                  raise SystemExit(f"Missing file: {path}")

              with path.open(encoding="utf-8") as file:
                  json.load(file)

              print(f"Valid JSON: {path}")
          PY

      # 6. Package unmanaged solution
      - name: Pack Power Platform solution
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out

          pac solution pack \
            --folder "$SOLUTION_FOLDER" \
            --zipfile "$SOLUTION_ZIP" \
            --packagetype Unmanaged

          test -s "$SOLUTION_ZIP"
          echo "Solution package created."

      # 7. Authenticate to Dev
      - name: Authenticate PAC CLI
        shell: bash
        env:
          PP_APP_ID: ${{ secrets.PP_APP_ID }}
          PP_TENANT_ID: ${{ secrets.PP_TENANT_ID }}
          PP_CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          DEV_ENVIRONMENT_URL: ${{ secrets.DEV_ENVIRONMENT_URL }}
        run: |
          set -euo pipefail

          : "${PP_APP_ID:?Missing PP_APP_ID secret}"
          : "${PP_TENANT_ID:?Missing PP_TENANT_ID secret}"
          : "${PP_CLIENT_SECRET:?Missing PP_CLIENT_SECRET secret}"
          : "${DEV_ENVIRONMENT_URL:?Missing DEV_ENVIRONMENT_URL secret}"

          pac auth create \
            --environment "$DEV_ENVIRONMENT_URL" \
            --applicationId "$PP_APP_ID" \
            --clientSecret "$PP_CLIENT_SECRET" \
            --tenant "$PP_TENANT_ID"

          pac org who

      # 8. Run Solution Checker
      - name: Run Power Platform Solution Checker
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out/checker-results

          pac solution check \
            --path "$SOLUTION_ZIP" \
            --outputDirectory out/checker-results \
            --geo India

      # 9. Upload checker reports even when a later step fails
      - name: Upload Solution Checker results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: power-platform-solution-checker-results
          path: out/checker-results/
          if-no-files-found: warn

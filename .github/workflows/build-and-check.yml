name: Build and Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    name: Validate Power Platform Solution
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Power Platform tools
      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      # 3. Validate solution folder
      - name: Validate solution folder
        shell: bash
        run: |
          set -euo pipefail

          SOLUTION_FOLDER="solutions/EmployeeALMDemo"

          if [ ! -d "$SOLUTION_FOLDER" ]; then
            echo "::error::Solution folder not found: $SOLUTION_FOLDER"
            exit 1
          fi

          echo "Solution source folder found."

      # 4. Validate deployment settings JSON
      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("deployment-settings/qa.json"),
              Path("deployment-settings/prod.json"),
          ]

          for file in files:
              if not file.is_file():
                  raise SystemExit(f"Missing file: {file}")

              with file.open(encoding="utf-8") as stream:
                  json.load(stream)

              print(f"Valid JSON: {file}")
          PY

      # 5. Create output directory
      - name: Prepare output directory
        shell: bash
        run: mkdir -p out

      # 6. Pack solution
      - name: Pack Power Platform Solution
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: solutions/EmployeeALMDemo
          solution-file: out/EmployeeALMDemo.zip
          solution-type: Unmanaged

      # 7. Run Power Platform Solution Checker
      - name: Run Power Platform Solution Checker
        uses: microsoft/powerplatform-actions/check-solution@v1
        with:
          environment-url: ${{ secrets.DEV_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          path: out/EmployeeALMDemo.zip
          geo: India
          fail-on-analysis-error: true
          checker-logs-artifact-name: solution-checker-logs

      # 8. Upload generated files for troubleshooting
      - name: Upload Solution Checker results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: power-platform-solution-checker-results
          path: out/
          if-no-files-found: warn


name: Deploy Managed Solution to QA

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Optional: Build Managed Solution run ID. Leave blank for latest successful build."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy-to-qa:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve build run ID
        id: resolve_build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_RUN_ID: ${{ inputs.build_run_id }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [ -n "$MANUAL_RUN_ID" ]; then
            RUN_ID="$MANUAL_RUN_ID"
            echo "Using manually selected build run: $RUN_ID"
          else
            RUN_ID=$(gh run list \
              --repo "$REPO" \
              --workflow build-managed-solution.yml \
              --branch main \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')

            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "::error::No successful managed build found on main."
              exit 1
            fi

            echo "Using latest successful managed build: $RUN_ID"
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download managed solution artifact
        uses: actions/download-artifact@v7
        with:
          name: EmployeeALMDemo-managed
          path: out
          run-id: ${{ steps.resolve_build.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify downloaded solution
        shell: bash
        run: |
          FILE="out/EmployeeALMDemo_managed.zip"

          if [ ! -s "$FILE" ]; then
            echo "::error::Managed solution ZIP is missing or empty."
            exit 1
          fi

          echo "Managed solution artifact found:"
          ls -lh "$FILE"

      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Verify QA connection
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ secrets.QA_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}

      - name: Import managed solution into QA
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ secrets.QA_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/EmployeeALMDemo_managed.zip
          use-deployment-settings-file: true
          deployment-settings-file: deployment-settings/qa.json
          publish-changes: true
          run-asynchronously: true
          max-async-wait-time: 60

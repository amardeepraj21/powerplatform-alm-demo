name: Deploy to QA

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Optional: GitHub Actions run ID that created the managed artifact'
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  SOLUTION_NAME: ${{ vars.PP_SOLUTION_NAME }}
  ARTIFACT_NAME: managed-solution
  SOLUTION_ZIP: out/${{ vars.PP_SOLUTION_NAME }}_managed.zip

jobs:
  deploy-qa:
    name: Import Managed Solution into QA
    runs-on: ubuntu-24.04
    environment: QA

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Validate configuration and deployment settings
      - name: Validate configuration
        shell: bash
        env:
          QA_URL: ${{ secrets.QA_ENVIRONMENT_URL }}
          APP_ID: ${{ secrets.PP_APP_ID }}
          TENANT_ID: ${{ secrets.PP_TENANT_ID }}
          CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$SOLUTION_NAME" ]; then
            echo "::error::Repository variable PP_SOLUTION_NAME is missing."
            exit 1
          fi

          if [ -z "$QA_URL" ] || [ -z "$APP_ID" ] || \
             [ -z "$TENANT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::One or more required GitHub secrets are missing."
            exit 1
          fi

          if [ ! -f deployment-settings/qa.json ]; then
            echo "::error::deployment-settings/qa.json not found."
            exit 1
          fi

          python -m json.tool deployment-settings/qa.json > /dev/null

          echo "Configuration validation passed."
          echo "Solution: $SOLUTION_NAME"
          echo "Expected artifact: $ARTIFACT_NAME"

      # 3. Select the successful managed solution build
      - name: Select managed solution build
        id: select-build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_RUN_ID" ]; then
            if [[ ! "$INPUT_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "::error::Build run ID must contain digits only."
              exit 1
            fi

            RUN_ID="$INPUT_RUN_ID"

            echo "Using manually selected build run: $RUN_ID"
          else
            RUN_ID=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow build-managed-solution.yml \
              --branch main \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')

            if [ -z "$RUN_ID" ]; then
              echo "::error::No successful Build Managed Solution run found on main."
              echo "Run the build workflow successfully before deploying to QA."
              exit 1
            fi

            echo "Selected latest successful build run: $RUN_ID"
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      # 4. Verify that the selected run contains the expected artifact
      - name: Verify build artifact exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ steps.select-build.outputs.run_id }}
        run: |
          set -euo pipefail

          echo "Checking artifact '$ARTIFACT_NAME' in run '$BUILD_RUN_ID'..."

          ARTIFACT_INFO=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\" and .expired == false) | {name: .name, expired: .expired, size_in_bytes: .size_in_bytes}" \
            | head -n 1 || true)

          if [ -z "$ARTIFACT_INFO" ]; then
            echo "::error::Artifact '$ARTIFACT_NAME' was not found in build run $BUILD_RUN_ID."
            echo "Open that run in GitHub Actions and check its Artifacts section."
            echo "Confirm that the build completed its Upload managed solution artifact step."
            exit 1
          fi

          echo "$ARTIFACT_INFO"
          echo "Artifact exists and is not expired."

      # 5. Download the managed solution from the selected build run
      - name: Download managed solution artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out
          repository: ${{ github.repository }}
          run-id: ${{ steps.select-build.outputs.run_id }}
          github-token: ${{ github.token }}

      # 6. Verify the downloaded managed solution ZIP
      - name: Verify managed solution ZIP
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="$SOLUTION_ZIP"

          if [ ! -s "$PACKAGE" ]; then
            echo "::error::Expected managed solution ZIP not found: $PACKAGE"
            echo "Downloaded files:"
            find out -maxdepth 2 -type f -print || true
            exit 1
          fi

          echo "Checking ZIP integrity..."
          unzip -t "$PACKAGE"

          echo "Managed solution artifact verified:"
          ls -lh "$PACKAGE"

      # 7. Install Power Platform tools
      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      # 8. Verify connection to QA
      - name: Verify QA environment connection
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ secrets.QA_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}

      # 9. Import the managed solution into QA
      - name: Import managed solution into QA
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ secrets.QA_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: ${{ env.SOLUTION_ZIP }}
          use-deployment-settings-file: true
          deployment-settings-file: deployment-settings/qa.json
          publish-changes: true
          run-asynchronously: true
          max-async-wait-time: 60
